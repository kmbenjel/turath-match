<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" font-family="Noto Naskh Arabic, Noto Sans, DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start">Every verdict carries its evidence</text><text x="30" y="66" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">work → edition → file: each level needs its own proof; what cannot be proven goes to review</text><rect x="30" y="92" width="360" height="260" rx="12" fill="#e8f1f8" stroke="#2f6f9f" stroke-width="1.5"/><text x="48" y="124" font-size="17" font-weight="700" fill="#2f6f9f" text-anchor="start">WORK</text><text x="48" y="150" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">same title AND same author</text><text x="48" y="184" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• title words agree (alternative titles, subtitles)</text><text x="48" y="216" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• author: shuhra / nasab / nisba (arabic-bib)</text><text x="48" y="248" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• a common name alone proves nothing</text><text x="48" y="280" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• death years within 2 (12 with full names)</text><text x="48" y="312" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• مختصر · شرح · ذيل · رواية → related</text><rect x="410" y="92" width="360" height="260" rx="12" fill="#f3eefc" stroke="#8250df" stroke-width="1.5"/><text x="428" y="124" font-size="17" font-weight="700" fill="#8250df" text-anchor="start">EDITION</text><text x="428" y="150" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">same imprint, or the same bytes</text><text x="428" y="184" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• exact file size or md5/sha1</text><text x="428" y="216" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• editor + publisher (or volumes) agree</text><text x="428" y="248" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• any field disagreeing → other edition</text><text x="428" y="280" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• a thesis or typed copy is not the print</text><text x="428" y="312" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• some volumes only → partial</text><rect x="790" y="92" width="360" height="260" rx="12" fill="#eaf5ec" stroke="#1a7f37" stroke-width="1.5"/><text x="808" y="124" font-size="17" font-weight="700" fill="#1a7f37" text-anchor="start">FILE</text><text x="808" y="150" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">this file IS that source file</text><text x="808" y="184" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• exact byte size, ≥ 100 KB</text><text x="808" y="216" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• several candidates → title decides</text><text x="808" y="248" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• --verify: md5/sha1 of the local file</text><text x="808" y="280" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• duplicates: size + 5 × 64 KB windows</text><text x="808" y="312" font-size="14.5" font-weight="400" fill="#1f2328" text-anchor="start">• --deep: full SHA-256</text><rect x="30" y="368" width="1120" height="44" rx="12" fill="#fff4e5" stroke="#bc4c00" stroke-width="1.5"/><text x="48" y="396" font-size="15" font-weight="600" fill="#bc4c00" text-anchor="start">uncertain → review.tsv with every reason · fill «decision» (same / different / related) · rerun with -d: your decisions are kept</text><path d="M392 222 l16 0" stroke="#59636e" stroke-width="2"/><path d="M402 216 l7 6 l-7 6" fill="none" stroke="#59636e" stroke-width="2"/><path d="M772 222 l16 0" stroke="#59636e" stroke-width="2"/><path d="M782 216 l7 6 l-7 6" fill="none" stroke="#59636e" stroke-width="2"/></svg>