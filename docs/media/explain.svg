<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="562" viewBox="0 0 1180 562" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14.5"><rect width="100%" height="100%" rx="10" fill="#14161a"/><circle cx="22" cy="18" r="6" fill="#f85149"/><circle cx="42" cy="18" r="6" fill="#d29922"/><circle cx="62" cy="18" r="6" fill="#3fb950"/><text x="22" y="46" fill="#79c0ff" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">$ turath-match explain &quot;فتح الباري|ابن حجر&quot; &quot;فتح الباري بشرح صحيح البخاري|ابن حجر العسقلاني&quot;</text><text x="22" y="68" fill="#e6e6e6" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">work: same  score 0.90 [high] -&gt; match  via fuzzy_title_author</text><text x="22" y="90" fill="#3fb950" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  + title      head: one title is the start of the other (a subtitle) «فتح الباري» / «فتح الباري بشرح صحيح البخاري»</text><text x="22" y="112" fill="#3fb950" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  + author     same: «ابن حجر» / «ابن حجر العسقلاني» (shuhra:ابن حجر)</text><text x="22" y="134" fill="#e6e6e6" xml:space="preserve" direction="ltr" unicode-bidi="plaintext"></text><text x="22" y="156" fill="#79c0ff" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">$ turath-match explain &quot;شرح صحيح مسلم|النووي&quot; &quot;صحيح مسلم|مسلم بن الحجاج&quot;</text><text x="22" y="178" fill="#e6e6e6" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">work: related (commentary, derived side: left)  score 0.70 [medium] -&gt; no_match  via fuzzy_title_author</text><text x="22" y="200" fill="#8b949e" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  · title      related: «شرح» makes it a commentary «شرح صحيح مسلم» / «صحيح مسلم»</text><text x="22" y="222" fill="#8b949e" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  · author     unknown: «النووي» / «مسلم بن الحجاج» (no-shared-part)</text><text x="22" y="244" fill="#f85149" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  - derivation commentary: the left record is built on the other</text><text x="22" y="266" fill="#e6e6e6" xml:space="preserve" direction="ltr" unicode-bidi="plaintext"></text><text x="22" y="288" fill="#79c0ff" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">$ turath-match explain &quot;الزهد|أحمد بن محمد بن حنبل&quot; &quot;الزهد|عبد الله بن المبارك&quot;</text><text x="22" y="310" fill="#e6e6e6" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">work: different  score 0.90 [high] -&gt; no_match  via exact_title_author</text><text x="22" y="332" fill="#3fb950" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  + title      exact: same one-word title «الزهد» / «الزهد»</text><text x="22" y="354" fill="#f85149" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  - author     different: «أحمد بن محمد بن حنبل» / «عبد الله بن المبارك» (ism-conflict:عبد الله!=احمد, nasab-conflict:المبارك! …</text><text x="22" y="376" fill="#f85149" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  - author     same title by another author: another work</text><text x="22" y="398" fill="#e6e6e6" xml:space="preserve" direction="ltr" unicode-bidi="plaintext"></text><text x="22" y="420" fill="#79c0ff" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">$ turath-match explain &quot;الرسالة|محمد&quot; &quot;الرسالة|محمد بن إدريس الشافعي&quot;</text><text x="22" y="442" fill="#e6e6e6" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">work: uncertain  score 0.45 [low] -&gt; review  via exact_title_author</text><text x="22" y="464" fill="#3fb950" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  + title      exact: same one-word title «الرسالة» / «الرسالة»</text><text x="22" y="486" fill="#8b949e" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  · author     unknown: «محمد» / «محمد بن إدريس الشافعي» (only-common-tokens, ism:محمد)</text><text x="22" y="508" fill="#8b949e" xml:space="preserve" direction="ltr" unicode-bidi="plaintext">  · author     the authors are not shown to be one person nor two: the title alone cannot prove the work</text><text x="22" y="530" fill="#e6e6e6" xml:space="preserve" direction="ltr" unicode-bidi="plaintext"></text></svg>