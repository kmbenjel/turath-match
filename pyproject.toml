[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turath-match"
version = "0.1.0"
description = "Reconcile an Arabic heritage library with Shamela, Waqfeya, archive.org, OpenITI and your own CSV: work, edition and exact-file matches, each with its evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Khalid Benjelloun" }]
keywords = ["arabic", "turath", "bibliography", "catalog", "reconciliation", "record-linkage", "openiti", "shamela", "archive.org", "deduplication", "digital-humanities"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Sociology :: History",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = ["arabic-bib>=0.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
turath-match = "turath_match.cli:main"

[project.urls]
Homepage = "https://github.com/kmbenjel/turath-match"
Documentation = "https://warraq.benjelloun.dev/turath-match/"
Changelog = "https://github.com/kmbenjel/turath-match/blob/main/CHANGELOG.md"
Issues = "https://github.com/kmbenjel/turath-match/issues"

[tool.uv.sources]
arabic-bib = { path = "../arabic-bib", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/turath_match"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "bench", "tools", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["turath_match"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # the formatter wraps code; long Arabic strings stay whole

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
